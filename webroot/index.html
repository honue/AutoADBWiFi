<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>Auto ADB Wi‑Fi</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f4f6fb; --card:#fff; --text:#182033; --muted:#758096;
      --line:#e9edf4; --primary:#3978f6; --success:#18a873;
      --danger:#dc5360; --soft:#f7f9fc; --shadow:0 12px 32px rgba(35,52,82,.08);
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#0f131b; --card:#191f2a; --text:#f2f5fa; --muted:#98a3b7;
        --line:#293140; --primary:#72a2ff; --success:#62d6aa;
        --danger:#ff929b; --soft:#121721; --shadow:none;
      }
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
        "Hiragino Sans GB","Microsoft YaHei",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    main {
      width:min(100%,620px); margin:auto;
      padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
    }
    header { padding:4px 4px 22px; }
    h1 { margin:0; font-size:28px; line-height:1.2; letter-spacing:-.5px; }
    .card {
      margin-bottom:16px; overflow:hidden; background:var(--card);
      border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    }
    .card-title {
      padding:18px 18px 10px; color:var(--muted);
      font-size:13px; font-weight:700; letter-spacing:.4px;
    }
    .status-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 14px 14px;
    }
    .status-item { min-width:0; padding:14px; background:var(--soft); border-radius:14px; }
    .status-label { display:block; margin-bottom:8px; color:var(--muted); font-size:12px; }
    .status-value { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:700; }
    .dot { width:8px; height:8px; flex:none; border-radius:50%; background:var(--muted); }
    .is-on { color:var(--success); }
    .is-off { color:var(--danger); }
    .is-on .dot { background:var(--success); }
    .is-off .dot { background:var(--danger); }
    .is-mode { color:var(--primary); }
    .is-mode .dot { background:var(--primary); }
    .setting {
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; min-height:76px; padding:15px 18px; border-top:1px solid var(--line);
    }
    .setting:first-of-type { border-top:0; }
    .setting-copy { min-width:0; }
    .setting-name { display:block; font-size:16px; font-weight:650; line-height:1.35; }
    .setting-desc { display:block; margin-top:4px; color:var(--muted); font-size:12px; line-height:1.45; }
    .switch { position:relative; width:50px; height:30px; flex:none; }
    .switch input { position:absolute; width:1px; height:1px; opacity:0; }
    .slider {
      position:absolute; inset:0; cursor:pointer; border-radius:999px;
      background:#b6bfcc; transition:.2s ease;
    }
    .slider::after {
      content:""; position:absolute; top:3px; left:3px; width:24px; height:24px;
      border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.22);
      transition:transform .2s ease;
    }
    .switch input:checked + .slider { background:var(--primary); }
    .switch input:checked + .slider::after { transform:translateX(20px); }
    .switch input:disabled + .slider { cursor:wait; opacity:.55; }
    .mode-setting { display:block; padding:15px 18px 18px; border-top:1px solid var(--line); }
    .segmented {
      display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:13px;
      padding:4px; background:var(--soft); border:1px solid var(--line); border-radius:14px;
    }
    .mode-option { position:relative; cursor:pointer; }
    .mode-option input { position:absolute; width:1px; height:1px; opacity:0; }
    .mode-label {
      display:flex; align-items:center; justify-content:center; min-height:44px;
      border-radius:10px; color:var(--muted); font-size:14px; font-weight:650;
      transition:background .2s ease,color .2s ease,box-shadow .2s ease;
    }
    .mode-option input:checked + .mode-label {
      color:var(--primary); background:var(--card);
      box-shadow:0 2px 8px rgba(35,52,82,.1);
    }
    .mode-option input:disabled + .mode-label { cursor:wait; opacity:.55; }
    footer { padding:8px 5px; color:var(--muted); text-align:center; font-size:12px; }
    footer a {
      color:var(--primary); text-decoration:none; font-weight:600;
    }
    @media (max-width:500px) { .status-grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:380px) { .status-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Auto ADB Wi‑Fi</h1>
    </header>

    <section class="card">
      <div class="card-title">当前状态</div>
      <div class="status-grid">
        <div class="status-item">
          <span class="status-label">Wi‑Fi 热点</span>
          <span id="hotspotStatus" class="status-value"><span class="dot"></span><span>读取中…</span></span>
        </div>
        <div class="status-item">
          <span class="status-label">ADB 是否开启</span>
          <span id="adbEnabledStatus" class="status-value"><span class="dot"></span><span>读取中…</span></span>
        </div>
        <div class="status-item">
          <span class="status-label">USB 模式</span>
          <span id="adbUsbStatus" class="status-value"><span class="dot"></span><span>读取中…</span></span>
        </div>
        <div class="status-item">
          <span class="status-label">Wi-Fi 模式</span>
          <span id="adbWifiStatus" class="status-value"><span class="dot"></span><span>读取中…</span></span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">WI‑FI 热点</div>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-name">开机自动开启热点</span>
          <span class="setting-desc">设备启动后自动恢复热点</span>
        </span>
        <span class="switch">
          <input id="hotspotBootToggle" type="checkbox">
          <span class="slider"></span>
        </span>
      </label>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-name">Wi‑Fi 热点</span>
          <span class="setting-desc">立即开启或关闭系统热点</span>
        </span>
        <span class="switch">
          <input id="hotspotToggle" type="checkbox">
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <section class="card">
      <div class="card-title">ADB OVER WI‑FI</div>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-name">开机使用 Wi‑Fi 模式</span>
          <span class="setting-desc">关闭时，设备开机后使用 USB 模式</span>
        </span>
        <span class="switch">
          <input id="bootToggle" type="checkbox">
          <span class="slider"></span>
        </span>
      </label>
      <div class="mode-setting">
        <span class="setting-copy">
          <span class="setting-name">ADB 连接模式</span>
          <span class="setting-desc">USB 与 Wi‑Fi 模式只能选择一个</span>
        </span>
        <div class="segmented" role="radiogroup" aria-label="ADB 连接模式">
          <label class="mode-option">
            <input id="adbUsbMode" type="radio" name="adbMode" value="usb">
            <span class="mode-label">USB 模式</span>
          </label>
          <label class="mode-option">
            <input id="adbWifiMode" type="radio" name="adbMode" value="wifi">
            <span class="mode-label">Wi‑Fi 模式</span>
          </label>
        </div>
      </div>
    </section>

    <footer>
      <a href="https://github.com/KernelSU-Modules-Repo/auto_adb_wifi">github.com/KernelSU-Modules-Repo/auto_adb_wifi</a>
      <div>Designed by honue</div>
    </footer>
  </main>

  <script type="module">
    import { exec } from './kernelsu.js';

    const moduleDir = '/data/adb/modules/auto_adb_wifi';
    const controls = [...document.querySelectorAll('input')];
    const adbEnabledStatus = document.getElementById('adbEnabledStatus');
    const adbUsbStatus = document.getElementById('adbUsbStatus');
    const adbWifiStatus = document.getElementById('adbWifiStatus');
    const hotspotStatus = document.getElementById('hotspotStatus');

    // Execute root module scripts through the KernelSU WebUI bridge.
    async function execRoot(command) {
      const result = await exec(command);
      if (result.errno) throw new Error((result.stderr || result.stdout || '操作失败').trim());
      return (result.stdout || result.stderr || '').trim();
    }

    function setBusy(value) {
      controls.forEach(control => { control.disabled = value; });
    }

    function renderStatus(element, enabled, detail = '') {
      element.className = 'status-value ' + (enabled ? 'is-on' : 'is-off');
      element.innerHTML = '<span class="dot"></span><span>' +
        (enabled ? '已开启' : '已关闭') + detail + '</span>';
    }

    async function refresh() {
      const [adbText, hotspotText] = await Promise.all([
        execRoot('/system/bin/sh ' + moduleDir + '/adb.sh status'),
        execRoot('/system/bin/sh ' + moduleDir + '/hotspot.sh status')
      ]);

      const adbEnabled = adbText.includes('ADB 是否开启：已开启');
      const adbWifi = adbText.includes('当前 ADB 模式：Wi-Fi');
      const adbBootEnabled = adbText.includes('开机自动开启：已开启');
      const hotspotEnabled = hotspotText.includes('当前热点：已开启');
      const hotspotBootEnabled = hotspotText.includes('开机自动开启热点：已开启');

      document.getElementById('adbWifiMode').checked = adbWifi;
      document.getElementById('adbUsbMode').checked = !adbWifi;
      document.getElementById('bootToggle').checked = adbBootEnabled;
      document.getElementById('hotspotToggle').checked = hotspotEnabled;
      document.getElementById('hotspotBootToggle').checked = hotspotBootEnabled;

      renderStatus(adbEnabledStatus, adbEnabled);
      renderStatus(adbUsbStatus, !adbWifi, adbWifi ? '（未使用）' : '（当前）');
      renderStatus(adbWifiStatus, adbWifi, adbWifi ? '（当前）' : '（未使用）');
      renderStatus(hotspotStatus, hotspotEnabled);
    }

    async function switchFeature(script, action) {
      setBusy(true);
      try {
        await execRoot('/system/bin/sh ' + moduleDir + '/' + script + ' ' + action);
        await refresh();
      } catch (error) {
        await refresh().catch(() => {});
      } finally {
        setBusy(false);
      }
    }

    document.getElementById('bootToggle').addEventListener('change', event => {
      switchFeature('adb.sh', event.target.checked ? 'boot-on' : 'boot-off');
    });
    document.getElementById('adbUsbMode').addEventListener('change', event => {
      if (event.target.checked) {
        switchFeature('adb.sh', 'off');
      }
    });
    document.getElementById('adbWifiMode').addEventListener('change', event => {
      if (event.target.checked) {
        switchFeature('adb.sh', 'on');
      }
    });
    document.getElementById('hotspotBootToggle').addEventListener('change', event => {
      switchFeature('hotspot.sh', event.target.checked ? 'boot-on' : 'boot-off');
    });
    document.getElementById('hotspotToggle').addEventListener('change', event => {
      switchFeature('hotspot.sh', event.target.checked ? 'on' : 'off');
    });

    setBusy(true);
    refresh()
      .catch(() => {})
      .finally(() => setBusy(false));
  </script>
</body>
</html>
